<style>

<script id="trip-core">
'use strict';
const TripCore = (() => {
  const APP_VERSION = '1.8.1';
  const VERSION = 8;
  const LIMITS = Object.freeze({members:200, family:100, days:100, expenses:100, ledger:5000, units:1000000000});
  const CATEGORIES = Object.freeze({breakfast:'早餐', lunch:'午餐', dinner:'晚餐', meal:'餐費', fuel:'油錢', rental:'租車費', parking:'停車費', other:'其他'});
  const LEDGER_TYPES = Object.freeze({adjustment:'其他用途／調整',charge:'個人加購',payment:'已繳款',refund:'已退款'});
  const isNamed = m => m.name.trim().length > 0;
  const familySize=m=>m.count===undefined?1:m.count;
  const isCar = e => e.category === 'fuel' || e.category === 'rental';
  const isTransport=e=>isCar(e)||e.category==='parking';
  const id = prefix => prefix + '_' + (globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2));
  function expense(category='other') {
    return {id:id('e'), name:CATEGORIES[category], category, amount:'', payerId:null, participantIds:[]};

  function shareRange(r) {
    const values=r.eligible.map(pid=>r.shares[pid]);
    if(!values.length||r.blocked)return '暫不分攤';
    const lo=Math.min(...values),hi=Math.max(...values);
    const unit=r.grouped?'組':'人';return lo===hi?`${money(lo)} 元／${unit}`:`${money(lo)}–${money(hi)} 元／${unit}`;
  }
  function payerName(e) {
    const person=state.members.find(m=>m.id===e?.payerId);
    return person&&C.isNamed(person)?person.name.trim():e?.payerId?'原代墊者未填姓名':'未指定代墊者';
  }
  function payerNote(e,compact=false) {
    const label='代墊：'+payerName(e);
    return `<span class="${compact?'expense-payer':'payer-note'}" data-payer="${e?.id||''}" title="${esc(label)}">${esc(label)}</span>`;
  }
  function payerOptions(e) {
    let html=`<option value="">未指定代墊者</option>`;
    if(e.payerId && !state.members.find(m=>m.id===e.payerId && C.isNamed(m)))html+=`<option value="${e.payerId}" selected>原代墊者尚未填姓名</option>`;
    html+=state.members.filter(C.isNamed).map(m=>`<option value="${m.id}" ${e.payerId===m.id?'selected':''}>${esc(m.name)}（${state.members.indexOf(m)+1}）</option>`).join('');
    return html;
  }

  function openVehicle(vehicleId=null) {

ooter>`;

  function updateVehiclePreview(){

    }
    if(action==='export'){
      const blob=new Blob([C.encode(state)],{type:'application/json;charset=utf-8'}), url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url;a.download='旅伴帳本-'+new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(new Date())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已匯出 JSON 備份，包含所有成員、日期、司機、費用與參與紀錄。');return;
    }
    if(action==='export-view') {
      const copy=document.documentElement.cloneNode(true);
      const embedded=document.createElement('script');embedded.id='trip-snapshot';embedded.type='application/json';
      embedded.textContent=JSON.stringify({createdAt:new Date().toISOString(),trip:state}).replace(/</g,'\\u003c');
      copy.querySelector('#trip-app').before(embedded);
      copy.querySelector('#expense-dialog').removeAttribute('open');copy.querySelector('#expense-dialog').replaceChildren();
      copy.querySelector('#view').replaceChildren();copy.querySelector('#roster-content').replaceChildren();copy.querySelector('#tabs').replaceChildren();copy.querySelector('#flash').textContent='';copy.querySelector('#roster').removeAttribute('open');
      const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='trip-view.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
      notify('已匯出唯讀網頁。可發布至 GitHub Pages 或傳送檔案；此為快照，修改後須重新匯出更新，不會即時同步。');return;
    }
    if(action==='example'||action==='reset'){
      if(!confirm(action==='example'?'載入範例將取代目前整趟資料。建議先匯出備份，確定繼續？':'確定重設全部資料？將恢復 25 個空白名額與 4 天，無法復原；建議先匯出備份。'))return;
      state=action==='example'?C.example():C.createTrip();active='overview';notify(action==='example'?'已載入範例。這是示範資料，可用「重設全部」清除。':'已重設為空白旅程。');commit();return;
    }
    if(action==='add-member'){
      if(state.members.length>=C.LIMITS.members)return;
      const m={id:C.id('p'),name:'',count:1,excludeTransport:false};state.members.push(m);commit();$('name-'+m.id).focus();return;
    }
    if(action==='delete-member'){
      if(state.members.length===1)return;
      const pid=button.dataset.person, m=state.members.find(m=>m.id===pid);
      const hasData=m.name.trim()||state.transportRides.some(ride=>ride.participantIds.includes(pid)||ride.halfDayIds?.includes(pid))||state.carExpenses.some(e=>e.payerId===pid||e.rides.some(ride=>ride.participantIds.includes(pid)||ride.halfDayIds?.includes(pid)))||state.ledger.some(e=>e.personId===pid||e.payerId===pid)||state.days.some(d=>d.drivers.includes(pid)||d.expenses.some(e=>e.payerId===pid||e.participantIds.includes(pid)));
      if(hasData&&!confirm(`確定刪除「${memberName(m)}」？將移除其個人紀錄、所有日期的司機、參與與代墊關聯，剩餘成員會重新分攤；建議先備份。`))return;
      state.members=state.members.filter(m=>m.id!==pid);
      const removeRidePerson=ride=>{ride.participantIds=ride.participantIds.filter(id=>id!==pid);if(ride.halfDayIds){ride.halfDayIds=ride.halfDayIds.filter(id=>id!==pid);if(!ride.halfDayIds.length)delete ride.halfDayIds;}};
      state.transportRides.forEach(removeRidePerson);
      state.carExpenses.forEach(e=>{if(e.payerId===pid)e.payerId=null;e.rides.forEach(removeRidePerson);});
      state.ledger=state.ledger.filter(e=>e.personId!==pid);state.ledger.forEach(e=>{if(e.payerId===pid)e.payerId=null;});
      state.days.forEach(d=>{d.drivers=d.drivers.filter(x=>x!==pid);d.expenses.forEach(e=>{e.participantIds=e.participantIds.filter(x=>x!==pid);if(e.payerId===pid)e.payerId=null;});});commit();return;
    }
    if(action==='add-day'){
      if(state.days.length>=C.LIMITS.days)return;
      const next=C.day(state.days.length+1);state.days.push(next);active=next.id;commit();return;
    }
    if(action==='delete-expense'&&expenseEditor&&expenseEditor.dayId!=='vehicles'){const source=state.days.find(day=>day.id===expenseEditor.dayId),cost=source?.expenses.find(e=>e.id===eid);if(!cost)return;if((cost.amount.trim()||cost.payerId||cost.participantIds.length)&&!confirm('確定刪除此筆費用及其參與、代墊紀錄？'))return;source.expenses=source.expenses.filter(e=>e.id!==eid);closeExpense();commit();return;}
    if(!d)return;
    if(action==='delete-day'){
      if(state.days.length===1||!confirm(`確定刪除「${d.name||'未命名日期'}」及當日所有費用、參與與司機紀錄？也會移除此日的整趟車資乘車紀錄並重新計算。建議先匯出備份。`))return;
      state.transportRides=state.transportRides.filter(ride=>ride.dayId!==d.id);
      state.carExpenses.forEach(e=>e.rides=e.rides.filter(ride=>ride.dayId!==d.id));
      const index=state.days.indexOf(d);state.days.splice(index,1);active=state.days[Math.max(0,index-1)].id;commit();return;
    }
    if(action==='add-expense'){
      if(d.expenses.length>=C.LIMITS.expenses)return;
      openExpense(d.id,null);return;
    }
    const e=d.expenses.find(e=>e.id===eid);if(!e)return;
    if(action==='delete-expense'){
      if((e.amount.trim()||e.payerId||e.participantIds.length)&&!confirm(`確定刪除「${e.name||'未命名費用'}」及其金額、代墊與參與紀錄？`))return;
      d.expenses=d.expenses.filter(e=>e.id!==eid);closeExpense();commit();return;
    }

  });
  $('tabs').addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    const ids=['overview','vehicles','personal',...state.days.map(d=>d.id)], index=ids.indexOf(active);
    const next=event.key==='Home'?0:event.key==='End'?ids.length-1:(index+(event.key==='ArrowRight'?1:-1)+ids.length)%ids.length;
    event.preventDefault();selectTab(ids[next]);$('tab-'+active).focus();
  });
  $('import-file').addEventListener('change',async event=>{
    if(readOnly)return;
    const file=event.target.files[0];if(!file)return;
    try {
      if(file.size>10*1024*1024)throw new Error('檔案不得超過 10 MB');
      const restored=C.decode(await file.text());
      if(!confirm('備份格式檢查通過。匯入將取代目前整趟資料，確定還原？'))return;
      state=restored;active='overview';commit();notify('已成功還原備份。所有日期、固定成員 ID 與參與紀錄均已保留。');
    } catch(err) {notify('匯入失敗，原資料未變更：'+err.message);}
    finally {event.target.value='';}
  });
  render();if(initialMessage)notify(initialMessage);
  if(!storageOk)$('save-status').textContent='自動儲存不可用，請使用 JSON 備份';
})();
</script>
</body>
</html>
