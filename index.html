 :root{--name:112px;--driver:66px}

<script id="trip-core">
'use strict';
const TripCore = (() => {
  const VERSION = 2;
  const LIMITS = Object.freeze({members:200, days:100, expenses:100, ledger:5000, units:1000000000});
  const CATEGORIES = Object.freeze({breakfast:'早餐', lunch:'午餐', dinner:'晚餐', fuel:'油錢', rental:'租車費', parking:'停車費', other:'其他'});
  const LEDGER_TYPES = Object.freeze({adjustment:'其他用途／調整',charge:'個人加購',payment:'已繳款',refund:'已退款'});
  const isNamed = m => m.name.trim().length > 0;
  const isCar = e => e.category === 'fuel' || e.category === 'rental';
  const id = prefix => prefix + '_' + (globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2));
  function expense(category='other') {
    return {id:id('e'), name:CATEGORIES[category], category, amount:'', payerId:null, participantIds:[]};
  }
  function day(number=1) {
    return {id:id('d'), name:`第 ${number} 天`, useCar:false, drivers:[], expenses:Object.keys(CATEGORIES).map(expense)};
  }
  function ledgerEntry(personId) {return {id:id('l'),personId,type:'adjustment',direction:'plus',description:'',amount:'',payerId:null};}
  function createTrip(people=30, days=10) {
    if (!Number.isInteger(people) || people < 1 || people > LIMITS.members || !Number.isInteger(days) || days < 1 || days > LIMITS.days) throw new Error('人數或天數超過範圍');
    return {version:VERSION, members:Array.from({length:people},()=>({id:id('p'), name:''})), days:Array.from({length:days},(_,i)=>day(i+1)),ledger:[]};
  }
  function parseAmount(raw) {
    if (typeof raw !== 'string') return {ok:false, units:0};
    const s = raw.trim();
    if (s === '') return {ok:true, units:0};
    if (!/^(?:\d+(?:\.\d?)?|\.\d)$/.test(s)) return {ok:false, units:0};
    const [whole='', fraction=''] = s.split('.');
    const units = Number(whole || '0') * 10 + Number(fraction || '0');
    return {ok:Number.isSafeInteger(units) && units >= 0 && units <= LIMITS.units, units:Number.isSafeInteger(units) && units <= LIMITS.units ? units : 0};
  }
  function split(units, memberIds) {
    if (!Number.isSafeInteger(units) || units < 0 || units > LIMITS.units || new Set(memberIds).size !== memberIds.length) throw new Error('分攤輸入不合法');
    const result = Object.create(null);
    if (!memberIds.length) return result;
    const base = Math.floor(units / memberIds.length), remainder = units % memberIds.length;
    memberIds.forEach((memberId,i)=>{result[memberId] = base + (i < remainder ? 1 : 0);});
    return result;
  }
  function calculateExpense(state, d, e) {
    const parsed = parseAmount(e.amount), issues = [];
    const driverIds = new Set(d.useCar ? d.drivers.filter(pid=>state.members.some(m=>m.id===pid && isNamed(m))) : []);
    const participants = new Set(e.participantIds);
    let eligible = state.members.filter(m=>isNamed(m) && participants.has(m.id) && !(isCar(e) && driverIds.has(m.id))).map(m=>m.id);
    let blocked = !parsed.ok;
    const issue = (code,message,blocks=false) => {issues.push({code,message}); if (blocks) blocked = true;};
    if (!parsed.ok) issue('invalid-amount','金額須為非負數、最多一位小數，且不超過 100,000,000 元。',true);
    if (isCar(e) && !d.useCar) {
      eligible = [];
      if (parsed.units > 0) issue('no-car','當日未用車，但保留了車資。請啟用用車，或清除／調整這筆費用；目前暫不分攤。',true);
    }
    if (parsed.units > 0) {
      if (isCar(e) && d.useCar && !driverIds.size) issue('missing-driver','有車資但尚未設定具名司機，請勾選當日司機；目前暫不分攤。',true);
      if (!eligible.length && !(isCar(e) && !d.useCar)) issue('no-participants','正金額沒有可分攤者，請確認姓名、參與勾選及司機免分攤。',true);
      const payer = state.members.find(m=>m.id===e.payerId && isNamed(m));
      if (!payer) issue('missing-payer','尚未指定具名代墊者，請補齊以完成收付款核對。');
    }
    const shares = Object.fromEntries(state.members.map(m=>[m.id,0]));
    if (!blocked) Object.assign(shares, split(parsed.units, eligible));

  }
  function summarize(state) {
    const people = state.members.filter(isNamed).map(m=>({id:m.id,name:m.name,meals:0,fuel:0,rental:0,other:0,personal:0,adjustment:0,total:0,advanced:0,paid:0,refunded:0,pay:0,receive:0}));
    const peopleById = new Map(people.map(p=>[p.id,p]));
    let total=0, allocated=0, unassignedAdvance=0;
    const issues=[], expenses=[], advances=[], ledgerResults=[];
    for (const d of state.days) for (const e of d.expenses) {
      const result=calculateExpense(state,d,e);
      total+=result.units; allocated+=result.allocated;
      const payer=peopleById.get(e.payerId);
      if (payer) {payer.advanced+=result.units;if(result.units)advances.push({personId:payer.id,dayId:d.id,expenseId:e.id,label:(d.name||'未命名日期')+' · '+(e.name||'未命名費用'),units:result.units});} else unassignedAdvance+=result.units;
      const bucket=['breakfast','lunch','dinner'].includes(e.category)?'meals':e.category==='fuel'?'fuel':e.category==='rental'?'rental':'other';
      for (const p of people) {p[bucket]+=result.shares[p.id]; p.total+=result.shares[p.id];}
      for (const issue of result.issues) issues.push({...issue,dayId:d.id,expenseId:e.id,dayName:d.name,expenseName:e.name});
      expenses.push({dayId:d.id,expenseId:e.id,...result});
    }
    for(const entry of state.ledger||[]) {
      const parsed=parseAmount(entry.amount),person=peopleById.get(entry.personId),payer=peopleById.get(entry.payerId),entryIssues=[];
      const issue=(code,message)=>entryIssues.push({code,message,ledgerId:entry.id,personId:entry.personId,dayName:'個人結算',expenseName:entry.description||LEDGER_TYPES[entry.type]});
      if(!parsed.ok)issue('invalid-ledger-amount','金額須為非負數、最多一位小數，且不超過 100,000,000 元。');
      if(parsed.units>0&&!person)issue('missing-ledger-person','此筆個人紀錄的成員尚未填姓名，請補齊；金額與紀錄仍保留。');
      let entryAllocated=0;
      if(entry.type==='charge') {
        total+=parsed.units;
        if(person){person.personal+=parsed.units;person.total+=parsed.units;allocated+=parsed.units;entryAllocated=parsed.units;}
        if(payer){payer.advanced+=parsed.units;if(parsed.units)advances.push({personId:payer.id,ledgerId:entry.id,label:'個人加購 · '+(person?.name||'未具名成員')+' · '+(entry.description||'未命名項目'),units:parsed.units});}
        else {unassignedAdvance+=parsed.units;if(parsed.units)issue('missing-payer','個人加購尚未指定具名代墊者，請補齊以完成收付款核對。');}
      } else if(person) {
        if(entry.type==='adjustment'){const signed=(entry.direction==='minus'?-1:1)*parsed.units;person.adjustment+=signed;person.total+=signed;}
        else person[entry.type==='payment'?'paid':'refunded']+=parsed.units;
      }
      issues.push(...entryIssues);ledgerResults.push({id:entry.id,units:parsed.units,amountValid:parsed.ok,allocated:entryAllocated,issues:entryIssues});
    }
    for (const p of people) {const balance=p.total-p.advanced-p.paid+p.refunded;p.pay=Math.max(0,balance);p.receive=Math.max(0,-balance);}

    const adjusted=people.reduce((n,p)=>n+p.adjustment,0);

  }
  function validateState(input) {
    const fail=message=>{throw new Error(message);};

    const text=(s,max,label)=>{if(typeof s!=='string'||s.length>max)fail(`${label}格式錯誤`); return s;};
    const ids = new Set();
    const readId=x=>{if(typeof x!=='string'||!/^[A-Za-z0-9_-]{1,80}$/.test(x)||ids.has(x))fail('ID 格式錯誤或重複'); ids.add(x);return x;};
    if(!object(input)||![1,VERSION].includes(input.version))fail('不支援的備份版本');
    if(!Array.isArray(input.members)||input.members.length<1||input.members.length>LIMITS.members)fail('名單須有 1–200 個名額');
    const members=input.members.map(m=>{if(!object(m))fail('成員格式錯誤');return {id:readId(m.id),name:text(m.name,80,'姓名')};});
    const memberIds=new Set(members.map(m=>m.id));
    function references(list) {
      if(!Array.isArray(list)||list.length>members.length||new Set(list).size!==list.length||list.some(x=>!memberIds.has(x)))fail('參與者或司機參照錯誤');
      return [...list];
    }
    if(!Array.isArray(input.days)||input.days.length<1||input.days.length>LIMITS.days)fail('日期須有 1–100 天');
    const days=input.days.map(d=>{
      if(!object(d)||typeof d.useCar!=='boolean')fail('每日設定格式錯誤');
      const dayId=readId(d.id), name=text(d.name,80,'日期名稱'), drivers=references(d.drivers);
      if(!Array.isArray(d.expenses)||d.expenses.length>LIMITS.expenses)fail('每天最多 100 筆費用');
      const expenses=d.expenses.map(e=>{
        if(!object(e)||!Object.hasOwn(CATEGORIES,e.category))fail('費用類別錯誤');
        if(e.payerId!==null&&!memberIds.has(e.payerId))fail('代墊者參照錯誤');
        return {id:readId(e.id),name:text(e.name,80,'費用名稱'),category:e.category,amount:text(e.amount,32,'金額'),payerId:e.payerId,participantIds:references(e.participantIds)};
      });
      return {id:dayId,name,useCar:d.useCar,drivers,expenses};
    });
    const rawLedger=input.ledger===undefined&&input.version===1?[]:input.ledger;
    if(!Array.isArray(rawLedger)||rawLedger.length>LIMITS.ledger)fail('個人紀錄須為陣列且最多 5,000 筆');
    const ledger=rawLedger.map(entry=>{
      if(!object(entry)||!Object.hasOwn(LEDGER_TYPES,entry.type)||!memberIds.has(entry.personId)||entry.payerId!==null&&!memberIds.has(entry.payerId))fail('個人紀錄格式或成員參照錯誤');
      if(entry.type!=='charge'&&entry.payerId!==null)fail('僅個人加購可指定代墊者');
      const direction=entry.direction??(entry.type==='payment'?'minus':'plus');
      if(!['plus','minus'].includes(direction)||entry.type!=='adjustment'&&direction!==(entry.type==='payment'?'minus':'plus'))fail('個人紀錄正負方向錯誤');
      return {id:readId(entry.id),personId:entry.personId,type:entry.type,direction,description:text(entry.description,160,'個人紀錄說明'),amount:text(entry.amount,32,'個人紀錄金額'),payerId:entry.payerId};
    });
    return {version:VERSION,members,days,ledger};
  }
  function encode(state) {return JSON.stringify(validateState(state),null,2);}
  function decode(raw) {
    if(typeof raw!=='string'||raw.length>10*1024*1024)throw new Error('備份超過 10 MB 或不是文字');
    let parsed;try{parsed=JSON.parse(raw);}catch{throw new Error('檔案不是有效的 JSON');}
    return validateState(parsed);
  }
  function example() {
    const s=createTrip(4,2);
    ['阿安','小晴','阿哲','小羽'].forEach((name,i)=>{s.members[i].name=name;});
    const p=s.members.map(m=>m.id);
    s.days.forEach((d,i)=>{d.useCar=true;d.drivers=[p[i]];});
    const set=(di,cat,amount,participants,payer)=>{const e=s.days[di].expenses.find(e=>e.category===cat);Object.assign(e,{amount,participantIds:participants,payerId:payer});};
    set(0,'breakfast','120',p,p[0]);set(0,'lunch','360',p.slice(0,3),p[1]);set(0,'dinner','800',p,p[2]);
    set(0,'fuel','300',p,p[0]);set(0,'rental','900',p,p[0]);set(0,'parking','100',p,p[1]);
    set(1,'breakfast','100',p.slice(1),p[1]);set(1,'fuel','240',p,p[1]);set(1,'other','200',p,p[3]);
    return s;
  }
  return Object.freeze({VERSION,LIMITS,CATEGORIES,LEDGER_TYPES,isNamed,isCar,id,expense,day,ledgerEntry,createTrip,parseAmount,split,calculateExpense,summarize,validateState,encode,decode,example});
})();
globalThis.TripCore=TripCore;
</script>

    if(action==='export'){
      const blob=new Blob([C.encode(state)],{type:'application/json;charset=utf-8'}), url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url;a.download='旅伴帳本-'+new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(new Date())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已匯出 JSON 備份，包含所有成員、日期、司機、費用與參與紀錄。');return;
    }
    if(action==='export-view') {
      const copy=document.documentElement.cloneNode(true);
      const embedded=document.createElement('script');embedded.id='trip-snapshot';embedded.type='application/json';
      embedded.textContent=JSON.stringify({createdAt:new Date().toISOString(),trip:state}).replace(/</g,'\\u003c');
      copy.querySelector('#trip-app').before(embedded);
      copy.querySelector('#expense-dialog').removeAttribute('open');copy.querySelector('#expense-dialog').replaceChildren();
      copy.querySelector('#view').replaceChildren();copy.querySelector('#roster-content').replaceChildren();copy.querySelector('#tabs').replaceChildren();copy.querySelector('#flash').textContent='';copy.querySelector('#roster').removeAttribute('open');
      const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='trip-view.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
      notify('已匯出唯讀網頁。可發布至 GitHub Pages 或傳送檔案；此為快照，修改後須重新匯出更新，不會即時同步。');return;
    }
    if(action==='example'||action==='reset'){
      if(!confirm(action==='example'?'載入範例將取代目前整趟資料。建議先匯出備份，確定繼續？':'確定重設全部資料？將恢復 30 個空白名額與 10 天，無法復原；建議先匯出備份。'))return;
      state=action==='example'?C.example():C.createTrip();active='overview';notify(action==='example'?'已載入範例。這是示範資料，可用「重設全部」清除。':'已重設為空白旅程。');commit();return;
    }
    if(action==='add-member'){
      if(state.members.length>=C.LIMITS.members)return;
      const m={id:C.id('p'),name:''};state.members.push(m);commit();$('name-'+m.id).focus();return;
    }
    if(action==='delete-member'){
      if(state.members.length===1)return;
      const pid=button.dataset.person, m=state.members.find(m=>m.id===pid);
      const hasData=m.name.trim()||state.ledger.some(e=>e.personId===pid||e.payerId===pid)||state.days.some(d=>d.drivers.includes(pid)||d.expenses.some(e=>e.payerId===pid||e.participantIds.includes(pid)));
      if(hasData&&!confirm(`確定刪除「${memberName(m)}」？將移除其個人紀錄、所有日期的司機、參與與代墊關聯，剩餘成員會重新分攤；建議先備份。`))return;
      state.members=state.members.filter(m=>m.id!==pid);
      state.ledger=state.ledger.filter(e=>e.personId!==pid);state.ledger.forEach(e=>{if(e.payerId===pid)e.payerId=null;});
      state.days.forEach(d=>{d.drivers=d.drivers.filter(x=>x!==pid);d.expenses.forEach(e=>{e.participantIds=e.participantIds.filter(x=>x!==pid);if(e.payerId===pid)e.payerId=null;});});commit();return;
    }
    if(action==='add-day'){
      if(state.days.length>=C.LIMITS.days)return;
      const next=C.day(state.days.length+1);state.days.push(next);active=next.id;commit();return;
    }
    if(!d)return;
    if(action==='delete-day'){
      if(state.days.length===1||!confirm(`確定刪除「${d.name||'未命名日期'}」及當日所有費用、參與與司機紀錄？建議先匯出備份。`))return;
      const index=state.days.indexOf(d);state.days.splice(index,1);active=state.days[Math.max(0,index-1)].id;commit();return;
    }
    if(action==='add-expense'){
      if(d.expenses.length>=C.LIMITS.expenses)return;
      openExpense(d.id,null);return;
    }
    const e=d.expenses.find(e=>e.id===eid);if(!e)return;
    if(action==='delete-expense'){
      if((e.amount.trim()||e.payerId||e.participantIds.length)&&!confirm(`確定刪除「${e.name||'未命名費用'}」及其金額、代墊與參與紀錄？`))return;
      d.expenses=d.expenses.filter(e=>e.id!==eid);closeExpense();commit();return;
    }

  });
  $('tabs').addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    const ids=['overview','personal',...state.days.map(d=>d.id)], index=ids.indexOf(active);
    const next=event.key==='Home'?0:event.key==='End'?ids.length-1:(index+(event.key==='ArrowRight'?1:-1)+ids.length)%ids.length;
    event.preventDefault();selectTab(ids[next]);$('tab-'+active).focus();
  });
  $('import-file').addEventListener('change',async event=>{
    if(readOnly)return;
    const file=event.target.files[0];if(!file)return;
    try {
      if(file.size>10*1024*1024)throw new Error('檔案不得超過 10 MB');
      const restored=C.decode(await file.text());
      if(!confirm('備份格式檢查通過。匯入將取代目前整趟資料，確定還原？'))return;
      state=restored;active='overview';commit();notify('已成功還原備份。所有日期、固定成員 ID 與參與紀錄均已保留。');
    } catch(err) {notify('匯入失敗，原資料未變更：'+err.message);}
    finally {event.target.value='';}
  });
  render();if(initialMessage)notify(initialMessage);
  if(!storageOk)$('save-status').textContent='自動儲存不可用，請使用 JSON 備份';
})();
</script>
</body>
</html>
